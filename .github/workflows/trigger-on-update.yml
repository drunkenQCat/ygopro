name: 检测"更新"标记并触发 srvpro

on:
  push:
    branches: [ "server" ]

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 检查提交注释是否包含"更新"
        id: check
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          if [[ "$COMMIT_MSG" == *"更新"* ]]; then
            echo "trigger=true" >> $GITHUB_OUTPUT
            echo "✅ 检测到'更新'标记"
          else
            echo "trigger=false" >> $GITHUB_OUTPUT
            echo "⏭️ 未检测到'更新'标记"
          fi

      - name: 检出 srvpro/publish
        if: steps.check.outputs.trigger == 'true'
        uses: actions/checkout@v4
        with:
          repository: drunkenQCat/srvpro
          ref: publish
          token: ${{ secrets.SRVPRO_TOKEN }}
          fetch-depth: 0

      - name: 在 srvpro 创建空提交
        if: steps.check.outputs.trigger == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "更新：由 ygopro/server 触发于 $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin publish
          echo "✅ 已触发 srvpro 重建"

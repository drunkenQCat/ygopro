name: Sync YGOPro Cards

on:
  schedule:
    - cron: '0 0 * * *'  # 每24小时运行一次
  workflow_dispatch:
    inputs:
      force:
        description: '强制执行（忽略最近24小时 cards.cdb 是否变更的限制）'
        required: false
        default: 'false'
  repository_dispatch:
    types: [update-cards]  # 可以通过 GitHub API 触发

permissions:
  contents: read
  pull-requests: write

jobs:
  sync-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout drunkenQCat/ygopro
        uses: actions/checkout@v4
        with:
          repository: drunkenQCat/ygopro
          ref: server-dev
          token: ${{ secrets.SRVPRO_TOKEN }}
          fetch-depth: 0

      - name: Setup Git config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream and rebase onto mycard/ygopro server
        id: rebase
        run: |
          OLD_SHA=$(git rev-parse HEAD)
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/mycard/ygopro.git
          else
            git remote add upstream https://github.com/mycard/ygopro.git
          fi
          git fetch upstream server --prune

          FORCE="${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}"
          if [[ "$FORCE" != "true" ]]; then
            if [[ -z "$(git log --since='24 hours ago' --pretty=format:%H upstream/server -- cards.cdb)" ]]; then
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "No cards.cdb updates in upstream in the last 24 hours"
              exit 0
            fi
          fi

          git rebase upstream/server
          NEW_SHA=$(git rev-parse HEAD)
          if [[ "$OLD_SHA" == "$NEW_SHA" ]]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes after rebase"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Rebased: $OLD_SHA -> $NEW_SHA"
          fi

      - name: Push rebased branch
        if: steps.rebase.outputs.changed == 'true'
        run: |
          git push --force-with-lease origin server-dev

      - name: Make empty commit to trigger CI/CD (更新)
        if: steps.rebase.outputs.changed == 'true'
        run: |
          git commit --allow-empty -m "更新：同步上游 mycard/ygopro@server $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin server-dev
        continue-on-error: true

      - name: Create pull request (server-dev -> server)
        if: steps.rebase.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.SRVPRO_TOKEN }}
          script: |
            const owner = 'drunkenQCat'
            const repo = 'ygopro'
            const head = `${owner}:server-dev`
            const base = 'server'
            const title = `更新：自动同步上游 (${new Date().toISOString()})`
            const body = [
              `- head: ${head}`,
              `- base: ${base}`,
              `- workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join('\n')

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base
            })
            if (prs.length > 0) {
              core.info(`PR already exists: #${prs[0].number}`)
              return
            }

            await github.rest.pulls.create({
              owner,
              repo,
              head,
              base,
              title,
              body
            })

      - name: Checkout drunkenQCat/srvpro
        if: steps.rebase.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: drunkenQCat/srvpro
          ref: publish
          token: ${{ secrets.SRVPRO_TOKEN }}
          fetch-depth: 0

      - name: Make empty commit to srvpro
        if: steps.rebase.outputs.changed == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git commit --allow-empty -m "更新：Trigger rebuild $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin publish
        continue-on-error: true
